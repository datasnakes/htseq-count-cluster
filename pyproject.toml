[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HTSeqCountCluster"
version = "2.0.0"
description = "Submit HTSeq count jobs through PBS/Torque or Slurm."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Shaurita Hutchins", email = "datasnakes@gmail.com"},
    {name = "Robert Gilmore", email = "datasnakes@gmail.com"},
]
keywords = ["bioinformatics", "htseq", "pbs", "rnaseq", "slurm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "HTSeq>=2.1,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov",
]
docs = [
    "great-docs>=0.17,<0.18; python_version >= '3.11'",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "great-docs>=0.17,<0.18; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/datasnakes/htseq-count-cluster"
Documentation = "https://datasnakes.github.io/htseq-count-cluster/"
Repository = "https://github.com/datasnakes/htseq-count-cluster"
Issues = "https://github.com/datasnakes/htseq-count-cluster/issues"

[project.scripts]
htseq-count-cluster = "HTSeqCountCluster.htseq_count_cluster:main"

[tool.setuptools.packages.find]
include = ["HTSeqCountCluster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
