  dark: "#8BC49C"

navbar_color:
  light: "#174D35"
  dark: "#0D2818"

navbar_order:
  - User Guide
  - Reference
  - Changelog

nav_icons:
  navbar:
    User Guide: book-open
    Reference: code-2
    Changelog: history
  sidebar:
    Getting started: rocket
    Slurm arrays: server
    PBS and Torque: terminal
    Merge count tables: table
    Migrating to 2.0: refresh-cw

dark_mode_toggle: true
keyboard_nav: true
back_to_top: true

